version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - YOTO_CLIENT_ID=${YOTO_CLIENT_ID}
      - YOTO_CLIENT_SECRET=${YOTO_CLIENT_SECRET:-not_required}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
    networks:
      - yoto-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - yoto-network
    restart: unless-stopped

networks:
  yoto-network:
    driver: bridge